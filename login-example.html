<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in – SkinPawsible Veterinary Clinic</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --purple:#5C2D8F; --purple-dark:#3F1D66; --purple-light:#8B52C9; --ink:#1B1530;
    --muted:#667085; --line:#E2D8F1; --lav:#EFE7F9; --bg:#F6F2FB;
  }
  *{box-sizing:border-box;margin:0}
  body{font-family:Poppins,system-ui,sans-serif;color:var(--ink);background:var(--bg);min-height:100vh;display:grid;place-items:center;padding:24px}

  .card{position:relative;width:100%;max-width:1000px;height:620px;border-radius:28px;overflow:hidden;background:#fff;box-shadow:0 30px 70px rgba(63,29,102,.22)}
  .art{position:absolute;inset:0;width:100%;height:100%}

  /* Form side */
  .form{position:absolute;left:0;top:0;bottom:0;width:48%;display:flex;flex-direction:column;justify-content:center;padding:0 0 0 7%}
  .form-inner{width:100%;max-width:370px}
  .logo{display:block;width:120px;height:120px;margin:0 auto 14px;border-radius:30px;object-fit:cover;box-shadow:0 12px 28px rgba(92,45,143,.28)}
  .sub{text-align:center;color:var(--muted);margin-bottom:26px}
  .field{position:relative;margin-bottom:16px}
  input[type=email],input[type=password],input[type=text]{width:100%;height:52px;border:1px solid var(--line);border-radius:999px;padding:0 48px 0 60px;font:inherit;font-size:.92rem;background:#fff;color:var(--ink);box-shadow:0 8px 22px rgba(92,45,143,.10)}
  input::placeholder{color:#9A8FB3}
  .ico{position:absolute;left:8px;top:8px;width:36px;height:36px;border-radius:50%;background:var(--lav);color:var(--purple);display:grid;place-items:center}
  .toggle{position:absolute;right:10px;top:8px;width:36px;height:36px;border:0;background:none;color:var(--muted);cursor:pointer;border-radius:50%}
  input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #B79BE0;outline-offset:2px}
  .row{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;margin:2px 8px 20px}
  .row label{display:flex;gap:8px;align-items:center;color:var(--muted);cursor:pointer}
  .row input{accent-color:var(--purple);width:16px;height:16px}
  a{color:var(--purple);font-weight:500;text-decoration:none}
  a:hover{text-decoration:underline}
  .submit{display:block;width:78%;height:50px;margin:0 auto;border:0;border-radius:999px;background:linear-gradient(90deg,var(--purple-light),var(--purple-dark));color:#fff;font:inherit;font-weight:600;cursor:pointer;box-shadow:0 10px 22px rgba(92,45,143,.35)}
  .submit:hover{filter:brightness(1.08)}
  .foot{text-align:center;color:var(--muted);font-size:.88rem;margin-top:22px}
  .foot a{font-weight:600}

  /* Welcome side */
  .welcome{position:absolute;right:70px;top:50%;transform:translateY(-50%);width:310px;text-align:center}
  .welcome h2{font-size:1.9rem;font-weight:600;margin-bottom:14px}
  .welcome p{color:#4A4560;line-height:1.75;font-size:.95rem}

  @media (max-width:900px){
    body{padding:0;place-items:stretch}
    .card{height:auto;border-radius:0;box-shadow:none}
    .art,.welcome{display:none}
    .form{position:static;width:100%;padding:40px 24px}
    .form-inner{margin:0 auto}
  }
</style>
</head>
<body>
<main class="card">
  <svg class="art" viewBox="0 0 1000 620" preserveAspectRatio="xMaxYMid slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#8B52C9"/><stop offset="1" stop-color="#3F1D66"/>
      </linearGradient>
      <radialGradient id="glow" cx=".75" cy=".1" r=".5">
        <stop offset="0" stop-color="#B58CF0" stop-opacity=".55"/><stop offset="1" stop-color="#B58CF0" stop-opacity="0"/>
      </radialGradient>
      <filter id="sh" x="-10%" y="-10%" width="120%" height="120%">
        <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#1B0B35" flood-opacity=".38"/>
      </filter>
      <g id="paw">
        <ellipse cx="0" cy="14" rx="20" ry="16"/>
        <ellipse cx="-22" cy="-10" rx="7" ry="10" transform="rotate(-20 -22 -10)"/>
        <ellipse cx="-8" cy="-24" rx="7" ry="10" transform="rotate(-6 -8 -24)"/>
        <ellipse cx="8" cy="-24" rx="7" ry="10" transform="rotate(6 8 -24)"/>
        <ellipse cx="22" cy="-10" rx="7" ry="10" transform="rotate(20 22 -10)"/>
      </g>
    </defs>

    <rect width="1000" height="620" fill="url(#bg)"/>
    <rect width="1000" height="620" fill="url(#glow)"/>

    <!-- faint trail of paws drifting away into the purple -->
    <g fill="#fff" opacity=".22">
      <use href="#paw" transform="translate(610 20) rotate(25) scale(.9)"/>
      <use href="#paw" transform="translate(790 48) rotate(42) scale(.8)"/>
      <use href="#paw" transform="translate(950 92) rotate(60) scale(.7)"/>
      <use href="#paw" transform="translate(575 605) rotate(150) scale(.9)"/>
      <use href="#paw" transform="translate(745 555) rotate(135) scale(.8)"/>
      <use href="#paw" transform="translate(900 498) rotate(120) scale(.7)"/>
    </g>

    <!-- white body whose edges grow into paw prints -->
    <g fill="#fff" filter="url(#sh)">
      <path d="M-100 -20 L430 -20 C520 40 600 80 700 100 S900 130 1020 150 L1020 430 C880 440 700 500 560 560 S440 620 400 640 L-100 640 Z"/>
      <use href="#paw" transform="translate(548 46) rotate(32) scale(2)"/>
      <use href="#paw" transform="translate(702 94) rotate(52) scale(1.6)"/>
      <use href="#paw" transform="translate(858 130) rotate(66) scale(1.3)"/>
      <use href="#paw" transform="translate(618 528) rotate(142) scale(2)"/>
      <use href="#paw" transform="translate(784 478) rotate(126) scale(1.6)"/>
      <use href="#paw" transform="translate(932 440) rotate(112) scale(1.3)"/>
    </g>
  </svg>

  <section class="form">
    <div class="form-inner">
      <img class="logo" src="logo.png" alt="SkinPawsible logo">
      <p class="sub">Log in to your clinic account.</p>

      <div class="field">
        <span class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3.5 7.5 12 13l8.5-5.5"/></svg></span>
        <input id="email" type="email" placeholder="Email address" aria-label="Email address" autocomplete="email">
      </div>
      <div class="field">
        <span class="ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="3"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg></span>
        <input id="pw" type="password" placeholder="Password" aria-label="Password" autocomplete="current-password">
        <button class="toggle" type="button" aria-label="Show password" onclick="const p=document.getElementById('pw');p.type=p.type==='password'?'text':'password'">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>

      <div class="row">
        <label><input type="checkbox"> Remember me</label>
        <a href="#">Forgot password?</a>
      </div>
      <button class="submit" type="button">Log in</button>
      <p class="foot">Don&rsquo;t have an account? <a href="#">Sign up</a></p>
    </div>
  </section>

  <section class="welcome">
    <h2>Welcome back</h2>
    <p>Your patients&rsquo; records, appointments and skin care plans are right where you left them.</p>
  </section>
</main>
</body>
</html>
