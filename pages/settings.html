<!DOCTYPE html>
<html lang="en">

<head>
  <script>(function () { var role = localStorage.getItem("userRole"); if (role) document.documentElement.setAttribute("data-role", role); }());</script>
  <script>
    const role = localStorage.getItem("userRole");
    if (role) document.documentElement.setAttribute("data-role", role);
    if (role === "superadmin") {
      document.documentElement.classList.add("role-superadmin");
    } else if (role) {
      document.documentElement.classList.add("role-clinic");
    }
    if (localStorage.getItem("userName") && localStorage.getItem("userRoleLabel")) {
      document.documentElement.classList.add("header-ready");
    }
  </script>
  <style>
    html.role-superadmin .sidebar .nav-item:has(> .nav-link[href="pet-records.html"]),
    html.role-superadmin .sidebar .nav-item:has(> .nav-link[href="scan-records.html"]),
    html.role-superadmin .sidebar .nav-item:has(> .nav-link[href="consultations.html"]) { display: none !important; }
    html.role-superadmin #adminNavigation { display: block !important; }
    html:not(.header-ready) .ha-profile { visibility: hidden; }
  </style>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Settings · SkinPawsible</title>
  <link rel="icon" type="image/jpeg" href="../images/LOGO.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Bootstrap Icons -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  >

  <!-- SkinPawsible CSS -->
  <link
    rel="stylesheet"
    href="../css/style.css"
  >
  <link
    rel="stylesheet"
    href="../css/app-shell.css?v=9"
  >
  <link href="../css/header-actions.css?v=2" rel="stylesheet">
</head>

<body>

  <!-- APP LAYOUT -->
  <div class="app-layout">

    <!-- SHARED SIDEBAR -->
    <div id="sidebar-container"></div>
    <script src="../js/sidebar-ui.js?v=6"></script>

    <!-- MAIN CONTENT -->
    <main class="main-content">

      <!-- TOPBAR -->
      <div class="topbar">

        <div>

          <h1 class="page-title">
            Settings
          </h1>

        </div>

        <div class="topbar-actions">

          <button
            type="button"
            class="btn btn-outline-secondary"
            id="logoutBtn"
          >
            Log out
          </button>

        </div>

      </div>


      <!-- ACCOUNT INFORMATION -->
      <div class="table-card mb-4">

        <div class="head">

          <div class="head-left">

            <h5>
              Account Information
            </h5>

          </div>

        </div>


        <form id="profileForm">

          <div class="row g-3">

            <!-- FULL NAME -->
            <div class="col-md-6">

              <label
                for="fullName"
                class="form-label"
              >
                Full Name
              </label>

              <input
                type="text"
                class="form-control"
                id="fullName"
                required
              >

            </div>


            <!-- EMAIL -->
            <div class="col-md-6">

              <label
                for="email"
                class="form-label"
              >
                Email
              </label>

              <input
                type="email"
                class="form-control"
                id="email"
                readonly
              >

            </div>

            <!-- ACCOUNT ROLE -->
            <div class="col-md-6">

              <label
                for="accountRole"
                class="form-label"
              >
                Account Role
              </label>

              <input
                type="text"
                class="form-control"
                id="accountRole"
                readonly
                aria-describedby="accountRoleHelp"
              >
           
            </div>


            <!-- SAVE -->
            <div class="col-12">

              <button
                type="submit"
                class="btn btn-primary"
                id="saveProfileBtn"
              >
                Save Changes
              </button>

            </div>

          </div>

        </form>

      </div>


      <!-- CHANGE PASSWORD -->
      <div class="table-card mb-4">

        <div class="head">

          <div class="head-left">

            <h5>
              Change Password
            </h5>

          </div>

        </div>


        <form id="passwordForm">

          <div class="row g-3">

            <!-- NEW PASSWORD -->
            <div class="col-md-6">

              <label
                for="newPassword"
                class="form-label"
              >
                New Password
              </label>

              <input
                type="password"
                class="form-control"
                id="newPassword"
                minlength="6"
                required
              >

            </div>


            <!-- CONFIRM PASSWORD -->
            <div class="col-md-6">

              <label
                for="confirmPassword"
                class="form-label"
              >
                Confirm New Password
              </label>

              <input
                type="password"
                class="form-control"
                id="confirmPassword"
                minlength="6"
                required
              >

            </div>


            <!-- CHANGE PASSWORD BUTTON -->
            <div class="col-12">

              <button
                type="submit"
                class="btn btn-primary"
                id="changePasswordBtn"
              >
                Change Password
              </button>

            </div>

          </div>

        </form>

      </div>


      <!-- ACCOUNT ACTIONS -->
      <div class="table-card">

        <div class="head">

          <div class="head-left">

            <h5>
              Account Actions
            </h5>

          </div>

        </div>


        <button
          type="button"
          class="btn btn-danger"
          id="settingsLogoutBtn"
        >
          Log Out
        </button>

      </div>

    </main>

  </div>


  <!-- Bootstrap JavaScript -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  ></script>


  <!-- SHARED SIDEBAR JAVASCRIPT -->
  <script type="module" src="../js/header-actions.js?v=6"></script>
  <script
    type="module"
    src="../js/sidebar.js?v=13"
  ></script>

  <!-- SETTINGS JAVASCRIPT -->
  <script
    type="module"
    src="../js/settings.js?v=2"
  ></script>

</body>

</html>
