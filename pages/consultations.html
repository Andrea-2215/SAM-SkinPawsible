<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function () { var role = localStorage.getItem("userRole"); if (role) document.documentElement.setAttribute("data-role", role); }());</script>
  <script>
    const role = localStorage.getItem("userRole");
    if (role) document.documentElement.setAttribute("data-role", role);
    if (role === "superadmin") {
      document.documentElement.classList.add("role-superadmin");
    } else if (role) {
      document.documentElement.classList.add("role-clinic");
    }
    if (localStorage.getItem("userName") && localStorage.getItem("userRoleLabel")) {
      document.documentElement.classList.add("header-ready");
    }
  </script>
  <style>
    html.role-superadmin .sidebar .nav-item:has(> .nav-link[href="pet-records.html"]),
    html.role-superadmin .sidebar .nav-item:has(> .nav-link[href="scan-records.html"]),
    html.role-superadmin .sidebar .nav-item:has(> .nav-link[href="consultations.html"]) { display: none !important; }
    html.role-superadmin #adminNavigation { display: block !important; }
    html:not(.header-ready) .ha-profile { visibility: hidden; }
  </style>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consultations · SkinPawsible</title>
  <link rel="icon" type="image/jpeg" href="../images/LOGO.jpg">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link
    href="../css/style.css"
    rel="stylesheet"
  >
  <link
    href="../css/app-shell.css?v=9"
    rel="stylesheet"
  >
  <link href="../css/header-actions.css?v=2" rel="stylesheet">


  <!-- ==================================================
       CONSULTATIONS PAGE CSS
  ================================================== -->

  <style>

    /* ========================================
       CHAT LAYOUT
    ======================================== */

    .chat-wrapper {
      display: flex;
      height: calc(100vh - 150px);
      min-height: 500px;
      background: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #e9ecef;
    }


    /* ========================================
       CONVERSATION LIST
    ======================================== */

    .chat-list {
      width: 300px;
      border-right: 1px solid #e9ecef;
      background: #ffffff;
      overflow-y: auto;
      flex-shrink: 0;
    }


    .chat-list-header {
      padding: 20px;
      border-bottom: 1px solid #e9ecef;
    }


    .chat-list-header h5 {
      margin-bottom: 5px;
    }


    .chat-list-header p {
      margin: 0;
      color: #6c757d;
      font-size: 14px;
    }


    .chat-user {
      display: block;
      padding: 15px 18px;
      text-decoration: none;
      color: inherit;
      border-bottom: 1px solid #f1f1f1;
      cursor: pointer;
    }


    .chat-user:hover {
      background: #f8f9fa;
    }


    .chat-user.active {
      background: var(--primary-light);
    }


    .chat-user-name {
      font-weight: 600;
      margin-bottom: 3px;
    }


    .chat-user-preview {
      font-size: 13px;
      color: #6c757d;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }


    /* ========================================
       CHAT CONTENT
    ======================================== */

    .chat-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }


    .chat-header {
      padding: 18px 20px;
      border-bottom: 1px solid #e9ecef;
      background: #ffffff;
    }


    .chat-header h5 {
      margin: 0;
    }


    .chat-header small {
      color: #6c757d;
    }


    /* ========================================
       MESSAGES
    ======================================== */

    .chat-messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      background: #f8f9fa;
    }


    .empty-chat {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #6c757d;
      text-align: center;
    }


    .message-row {
      display: flex;
      margin-bottom: 12px;
    }


    .message-row.sent {
      justify-content: flex-end;
    }


    .message-row.received {
      justify-content: flex-start;
    }


    .message-bubble {
      max-width: 70%;
      padding: 10px 14px;
      border-radius: 14px;
      word-wrap: break-word;
    }


    .message-row.sent .message-bubble {
      background: var(--primary);
      color: white;
      border-bottom-right-radius: 4px;
    }


    .message-row.received .message-bubble {
      background: white;
      border: 1px solid #e9ecef;
      border-bottom-left-radius: 4px;
    }


    .message-time {
      font-size: 11px;
      margin-top: 4px;
      opacity: 0.7;
    }

    .chat-image-button {
      position: relative;
      display: block;
      max-width: 100%;
      margin-top: 8px;
      padding: 0;
      overflow: hidden;
      border: 0;
      border-radius: 8px;
      background: transparent;
      cursor: zoom-in;
    }

    .chat-image-button img {
      display: block;
      max-width: min(260px, 100%);
      max-height: 220px;
      border-radius: inherit;
      object-fit: contain;
    }

    .chat-image-zoom {
      position: absolute;
      right: 8px;
      bottom: 8px;
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.65);
      color: #ffffff;
      opacity: 0;
      transition: opacity 0.15s ease;
    }

    .chat-image-button:hover .chat-image-zoom,
    .chat-image-button:focus-visible .chat-image-zoom {
      opacity: 1;
    }

    .chat-image-button:focus-visible {
      outline: 3px solid var(--primary);
      outline-offset: 3px;
    }

    .chat-image-preview-content {
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
      background: #111827;
      color: #ffffff;
    }

    .chat-image-preview-dialog.modal-dialog {
      width: min(1000px, calc(100vw - 3rem));
      max-width: none;
      height: min(850px, calc(100vh - 3rem));
      height: min(850px, calc(100dvh - 3rem));
      min-height: 0;
      margin: auto;
    }

    .chat-image-preview-header {
      flex: 0 0 auto;
      border-bottom: 0;
    }

    .chat-image-preview-body {
      display: flex;
      flex: 1 1 auto;
      flex-direction: column;
      align-items: stretch;
      min-height: 0;
      padding: 0 1rem 1rem;
      overflow: auto;
    }

    .chat-image-zoom-controls {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding-bottom: 0.75rem;
    }

    .chat-image-stage {
      display: flex;
      flex: 1 1 auto;
      align-items: center;
      justify-content: center;
      min-height: 0;
      overflow: hidden;
      touch-action: none;
    }

    .chat-image-stage.is-zoomed {
      cursor: grab;
    }

    .chat-image-stage.is-dragging {
      cursor: grabbing;
    }

    .chat-image-zoom-level {
      min-width: 3.5rem;
      color: #ffffff;
      text-align: center;
    }

    .chat-image-preview-body img {
      display: block;
      flex: 0 0 auto;
      max-width: 100%;
      max-height: 100%;
      user-select: none;
      object-fit: contain;
      transform-origin: center;
      pointer-events: none;
    }

    @media (max-width: 576px) {
      .chat-image-preview-dialog.modal-dialog {
        width: calc(100vw - 1rem);
        height: calc(100vh - 1rem);
        height: calc(100dvh - 1rem);
      }
    }


    /* ========================================
       MESSAGE INPUT
    ======================================== */

    .chat-input-area {
      padding: 15px;
      border-top: 1px solid #e9ecef;
      background: white;
    }


    .chat-input-group {
      display: flex;
      gap: 10px;
    }


    .chat-input-group textarea {
      resize: none;
    }


    /* ========================================
       RESPONSIVE
    ======================================== */

    @media (max-width: 768px) {

      .chat-wrapper {
        height: calc(100vh - 130px);
        min-height: 450px;
      }

      .chat-list {
        width: 220px;
      }

      .message-bubble {
        max-width: 85%;
      }

      .chat-image-zoom {
        opacity: 1;
      }

      .chat-header {
        padding: 15px;
      }

      .chat-messages {
        padding: 15px;
      }

      .chat-input-area {
        padding: 10px;
      }

    }


    @media (max-width: 576px) {

      .chat-wrapper {
        height: calc(100vh - 120px);
      }

      .chat-list {
        width: 180px;
      }

      .chat-user {
        padding: 12px;
      }

      .chat-list-header {
        padding: 15px;
      }

      .chat-user-name {
        font-size: 14px;
      }

      .chat-user-preview {
        font-size: 12px;
      }

      .chat-input-group {
        gap: 5px;
      }

      .chat-input-group button {
        padding-left: 12px;
        padding-right: 12px;
      }

    }

  </style>

<body class="chat-page">
  <div class="app-layout">

    <!-- sidebar.js loads the shared navigation here -->
    <div id="sidebar-container"></div>
    <script src="../js/sidebar-ui.js?v=6"></script>

    <main class="main-content">

      <div class="topbar">
        <div>
          <h1 class="page-title">Consultations</h1>

        </div>
        <div class="topbar-actions">
          <button class="btn btn-outline-secondary" id="logoutBtn" type="button">Log out</button>
        </div>
      </div>

      <div class="chat-wrapper" id="chatWrapper">

        <!-- Conversation list -->
        <section class="chat-list" aria-label="Conversations">
          <div class="chat-list-header">
            <label class="chat-search">
              <i class="bi bi-search" aria-hidden="true"></i>
              <input
                type="search"
                id="chatSearch"
                class="form-control form-control-sm"
                placeholder="Search conversations"
                aria-label="Search conversations"
              >
            </label>
          </div>
          <div class="chat-filter-tabs" role="tablist" aria-label="Conversation filters">
            <button type="button" class="chat-filter-tab is-active" data-chat-filter="open" aria-selected="true">Open</button>
            <button type="button" class="chat-filter-tab" data-chat-filter="mine" aria-selected="false">Mine</button>
            <button type="button" class="chat-filter-tab" data-chat-filter="unassigned" aria-selected="false">Unassigned</button>
            <button type="button" class="chat-filter-tab" data-chat-filter="resolved" aria-selected="false">
              Resolved<span id="resolvedUnreadIndicator" class="chat-filter-attention-dot" hidden aria-hidden="true"></span>
            </button>
            <button type="button" class="chat-filter-tab" data-chat-filter="escalated" aria-selected="false" hidden>Escalated to me</button>
            <button type="button" class="chat-filter-tab" data-chat-filter="standard" aria-selected="false" hidden>Standard · read only</button>
            <button type="button" class="chat-filter-tab" data-chat-filter="medical-resolved" aria-selected="false" hidden>Medical resolved</button>
          </div>
          <div id="chatUsersList">
            <div class="chat-list-status">Loading conversations...</div>
          </div>
        </section>

        <!-- Conversation pane -->
        <section class="chat-content" aria-label="Messages">
          <div class="chat-header">
            <button type="button" class="chat-back" id="chatBackBtn" aria-label="Back to conversations">
              <i class="bi bi-arrow-left" aria-hidden="true"></i>
            </button>
            <div class="chat-header-text">
              <h5 id="chatPetName">Select a conversation</h5>
              <small id="chatOwnerName"></small>
            </div>
            <div class="chat-header-actions" id="chatHeaderActions"></div>
          </div>

          <div class="chat-messages" id="chatMessages" aria-live="polite">
            <div class="empty-chat">
              <i class="bi bi-chat-square-text" aria-hidden="true"></i>
              <p class="mb-0">Select a conversation to start chatting.</p>
            </div>
          </div>

          <div class="chat-input-area">
            <input
              type="file"
              id="chatPhotoInput"
              accept="image/jpeg,image/png,image/gif,image/webp"
              hidden
            >
            <input
              type="file"
              id="chatFileInput"
              accept=".pdf,.doc,.docx,.xls,.xlsx,.csv,.txt"
              hidden
            >
            <div class="chat-compose-legend" id="chatComposeLegend">You'll send as clinic staff</div>
            <div class="chat-input-group">
              <button
                type="button"
                class="chat-attach"
                id="sendPhotoBtn"
                aria-label="Send photo"
                title="Send photo"
                disabled
              >
                <i class="bi bi-image" aria-hidden="true"></i>
              </button>
              <button
                type="button"
                class="chat-attach"
                id="sendFileBtn"
                aria-label="Send file"
                title="Send file"
                disabled
              >
                <i class="bi bi-paperclip" aria-hidden="true"></i>
              </button>
              <textarea
                id="messageInput"
                class="form-control"
                rows="1"
                placeholder="Select a conversation to write a message"
                aria-label="Message"
                disabled
              ></textarea>
              <button type="button" class="btn btn-primary chat-send" id="sendMessageBtn" aria-label="Send message" disabled>
                <i class="bi bi-send-fill" aria-hidden="true"></i>
              </button>
            </div>
            <p class="chat-attachment-status" id="chatAttachmentStatus" role="status" aria-live="polite"></p>
            <p class="chat-hint">Enter to send, Shift + Enter for a new line.</p>
          </div>
        </section>
      </div>

      <!-- Image preview -->
      <div class="modal fade" id="chatImagePreviewModal" tabindex="-1" aria-labelledby="chatImagePreviewTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered chat-image-preview-dialog">
          <div class="modal-content chat-image-preview-content">
            <div class="modal-header chat-image-preview-header">
              <h2 class="modal-title fs-6" id="chatImagePreviewTitle">Image preview</h2>
              <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close image preview"></button>
            </div>
            <div class="modal-body chat-image-preview-body">
              <div class="chat-image-zoom-controls" aria-label="Image zoom controls">
                <button type="button" class="btn btn-sm btn-outline-light" id="chatImageZoomOut" aria-label="Zoom out" title="Zoom out"><i class="bi bi-dash-lg" aria-hidden="true"></i></button>
                <span class="chat-image-zoom-level" id="chatImageZoomLevel" aria-live="polite">100%</span>
                <button type="button" class="btn btn-sm btn-outline-light" id="chatImageZoomIn" aria-label="Zoom in" title="Zoom in"><i class="bi bi-plus-lg" aria-hidden="true"></i></button>
                <button type="button" class="btn btn-sm btn-outline-light" id="chatImageZoomReset">Reset</button>
              </div>
              <div class="chat-image-stage">
                <img id="chatImagePreview" alt="">
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- New conversation -->
      <div class="modal fade" id="newChatModal" tabindex="-1" aria-labelledby="newChatTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content">
            <div class="modal-header">
              <h2 class="modal-title" id="newChatTitle">New conversation</h2>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <input type="search" id="ownerSearch" class="form-control" placeholder="Search pet owners by name or email" aria-label="Search pet owners">
              <div class="owner-pick-list" id="ownerPickList"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="modal fade" id="escalateVetModal" tabindex="-1" aria-labelledby="escalateVetTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content">
            <div class="modal-header">
              <h2 class="modal-title fs-5" id="escalateVetTitle">Escalate to a veterinarian</h2>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <label class="form-label" for="escalationVetSelect">Choose an active veterinarian</label>
              <select class="form-select" id="escalationVetSelect"></select>
              <p class="small text-danger mt-2 mb-0" id="escalationVetError" role="alert" hidden></p>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
              <button type="button" class="btn btn-primary" id="escalateVetConfirm">Escalate chat</button>
            </div>
          </div>
        </div>
      </div>

    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../js/header-actions.js?v=6"></script>
  <script type="module" src="../js/sidebar.js?v=13"></script>
  <script type="module" src="../js/consultations.js?v=17"></script>
</body>
</html>
