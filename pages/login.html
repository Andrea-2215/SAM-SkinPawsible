<!DOCTYPE html>
<html lang="en">
<head>
<script>(function () { var role = localStorage.getItem("userRole"); if (role) document.documentElement.setAttribute("data-role", role); }());</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In · SkinPawsible</title>
<link rel="icon" type="image/jpeg" href="../images/LOGO.jpg">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../css/style.css" rel="stylesheet">
<link href="../css/login.css?v=2" rel="stylesheet">
<link href="../css/app-shell.css?v=9" rel="stylesheet">
</head>
<body class="lp-page lp-login-page">

<div class="lp-wrap">
  <main class="lp-login-shell">
    <svg class="lp-login-art" viewBox="0 0 1000 620" preserveAspectRatio="xMaxYMid slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <linearGradient id="login-bg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#8b52c9"/>
          <stop offset="1" stop-color="#3f1d66"/>
        </linearGradient>
        <radialGradient id="login-glow" cx=".75" cy=".1" r=".5">
          <stop offset="0" stop-color="#b58cf0" stop-opacity=".55"/>
          <stop offset="1" stop-color="#b58cf0" stop-opacity="0"/>
        </radialGradient>
        <filter id="login-shadow" x="-10%" y="-10%" width="120%" height="120%">
          <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#1b0b35" flood-opacity=".38"/>
        </filter>
        <g id="login-paw">
          <ellipse cx="0" cy="14" rx="20" ry="16"/>
          <ellipse cx="-22" cy="-10" rx="7" ry="10" transform="rotate(-20 -22 -10)"/>
          <ellipse cx="-8" cy="-24" rx="7" ry="10" transform="rotate(-6 -8 -24)"/>
          <ellipse cx="8" cy="-24" rx="7" ry="10" transform="rotate(6 8 -24)"/>
          <ellipse cx="22" cy="-10" rx="7" ry="10" transform="rotate(20 22 -10)"/>
        </g>
      </defs>
      <rect width="1000" height="620" fill="url(#login-bg)"/>
      <rect width="1000" height="620" fill="url(#login-glow)"/>
      <g fill="#fff" opacity=".22">
        <use href="#login-paw" transform="translate(610 20) rotate(25) scale(.9)"/>
        <use href="#login-paw" transform="translate(790 48) rotate(42) scale(.8)"/>
        <use href="#login-paw" transform="translate(950 92) rotate(60) scale(.7)"/>
        <use href="#login-paw" transform="translate(575 605) rotate(150) scale(.9)"/>
        <use href="#login-paw" transform="translate(745 555) rotate(135) scale(.8)"/>
        <use href="#login-paw" transform="translate(900 498) rotate(120) scale(.7)"/>
      </g>
      <g fill="#fff" filter="url(#login-shadow)">
        <path d="M-100 -20 L430 -20 C520 40 600 80 700 100 S900 130 1020 150 L1020 430 C880 440 700 500 560 560 S440 620 400 640 L-100 640 Z"/>
        <use href="#login-paw" transform="translate(548 46) rotate(32) scale(2)"/>
        <use href="#login-paw" transform="translate(702 94) rotate(52) scale(1.6)"/>
        <use href="#login-paw" transform="translate(858 130) rotate(66) scale(1.3)"/>
        <use href="#login-paw" transform="translate(618 528) rotate(142) scale(2)"/>
        <use href="#login-paw" transform="translate(784 478) rotate(126) scale(1.6)"/>
        <use href="#login-paw" transform="translate(932 440) rotate(112) scale(1.3)"/>
      </g>
    </svg>
    <section class="lp-login-form-panel" aria-label="Clinic staff login">
      <div class="lp-card">
        <div class="lp-brand">
          <img class="lp-logo" src="../images/LOGO.jpg" alt="SkinPawsible">
          <p>Log in to your clinic account.</p>
        </div>

        <form id="loginForm" novalidate>
          <div class="mb-3">
            <label class="form-label visually-hidden" for="email">Email address</label>
            <div class="lp-input-wrap">
              <span class="lp-input-icon" aria-hidden="true">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
              </span>
              <input type="email" class="form-control" id="email" placeholder="Email address" autocomplete="username" required>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label visually-hidden" for="password">Password</label>
            <div class="lp-pw lp-input-wrap">
              <span class="lp-input-icon" aria-hidden="true">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
              </span>
              <input type="password" class="form-control" id="password" placeholder="Password" autocomplete="current-password" required>
              <button type="button" class="lp-eye" data-target="password" aria-label="Show password">
                <svg class="eye-on" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="eye-off" style="display:none" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
              </button>
            </div>
          </div>

          <div class="lp-login-options">
            <a href="#" id="forgotLink" class="lp-forgot">Forgot password?</a>
          </div>

          <div id="formError" class="text-danger small mb-3" style="display:none;" role="alert"></div>

          <button type="submit" class="btn lp-btn w-100" id="loginBtn">
            <span id="loginBtnText">Log in</span>
            <span id="loginSpinner" class="spinner-border spinner-border-sm ms-2" style="display:none;" aria-hidden="true"></span>
          </button>
        </form>

        <p class="lp-foot">Don't have an account? <a href="register.html">Sign up</a></p>
      </div>
    </section>

    <aside class="lp-login-welcome">
      <div class="lp-welcome-copy">
        <h1>Welcome back</h1>
        <p>Designed for vets and clinic staff to keep every appointment, record, and care plan in reach.</p>
      </div>
    </aside>
  </main>
</div>

<!-- Toasts -->
<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div id="appToast" class="toast" role="alert">
    <div class="d-flex">
      <div class="toast-body" id="appToastBody"></div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // show / hide password (icon changes too)
  document.querySelectorAll('.lp-eye').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var input = document.getElementById(btn.dataset.target);
      var show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      btn.querySelector('.eye-on').style.display = show ? 'none' : '';
      btn.querySelector('.eye-off').style.display = show ? '' : 'none';
      btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    });
  });
</script>
<script src="../js/sidebar-ui.js?v=4"></script>
<script type="module" src="../js/login.js?v=2"></script>
</body>
</html>
