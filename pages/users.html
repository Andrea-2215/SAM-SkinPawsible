
<!DOCTYPE html>
<html lang="en">

<head>
  <script>(function () { var role = localStorage.getItem("userRole"); if (role) document.documentElement.setAttribute("data-role", role); }());</script>
  <script>
    const role = localStorage.getItem("userRole");
    if (role) document.documentElement.setAttribute("data-role", role);
    if (role === "superadmin") {
      document.documentElement.classList.add("role-superadmin");
    } else if (role) {
      document.documentElement.classList.add("role-clinic");
    }
    if (localStorage.getItem("userName") && localStorage.getItem("userRoleLabel")) {
      document.documentElement.classList.add("header-ready");
    }
  </script>
  <style>
    html.role-superadmin .sidebar .nav-item:has(> .nav-link[href="pet-records.html"]),
    html.role-superadmin .sidebar .nav-item:has(> .nav-link[href="scan-records.html"]),
    html.role-superadmin .sidebar .nav-item:has(> .nav-link[href="consultations.html"]) { display: none !important; }
    html.role-superadmin #adminNavigation { display: block !important; }
    html:not(.header-ready) .ha-profile { visibility: hidden; }
  </style>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Users · SkinPawsible</title>
  <link rel="icon" type="image/jpeg" href="../images/LOGO.jpg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- SkinPawsible CSS -->
  <link href="../css/style.css" rel="stylesheet">
  <link href="../css/app-shell.css?v=9" rel="stylesheet">
  <link
    href="../css/style.css"
    rel="stylesheet"
  >
  <link
    href="../css/app-shell.css?v=9"
    rel="stylesheet"
  >
  <link href="../css/header-actions.css?v=2" rel="stylesheet">
  <link href="../css/users.css?v=2" rel="stylesheet">

</head>

<body class="users-accounts-page">

  <!-- APP LAYOUT -->
  <div class="app-layout">

    <!-- SHARED SIDEBAR -->
    <div id="sidebar-container"></div>
    <script src="../js/sidebar-ui.js?v=6"></script>

    <!-- MAIN CONTENT -->
    <main class="main-content">

      <!-- TOPBAR -->
      <div class="topbar">
        <div>
          <h1 class="page-title">User accounts</h1>
          <p class="page-sub">Create accounts, assign roles and approve access.</p>
        </div>

        <div class="topbar-actions">
          <button
            type="button"
            class="btn btn-outline-secondary"
            id="logoutBtn"
          >
            Log out
          </button>
        </div>
      </div>

      <!-- PAGE CONTENT -->
      <div class="container-fluid px-0">

        <!-- STAFF AND VETERINARIAN ACCOUNTS -->
        <div class="table-card mb-4">

          <div class="users-toolbar">
            <input type="search" class="form-control users-search" id="userSearch" placeholder="Search name, email or role" aria-label="Search name, email or role">
            <button type="button" class="btn btn-primary users-add-button" id="addUserBtn">Add user</button>
          </div>

          <div class="users-tabs" role="tablist" aria-label="User administration">
            <button type="button" class="users-tab is-active" id="usersTab" role="tab" aria-selected="true">Users</button>
            <button type="button" class="users-tab" id="rolesTab" role="tab" aria-selected="false" hidden>Roles &amp; permissions</button>
          </div>

          <section class="roles-panel" id="rolesPanel" hidden aria-labelledby="rolesTab">
            <div class="role-cards" id="roleCards">
              <button type="button" class="role-card is-selected" data-permission-role="admin">
                <strong>Administrator</strong><span>Runs the clinic day to day</span><small data-role-count="admin">0 users</small>
              </button>
              <button type="button" class="role-card" data-permission-role="vet">
                <strong>Veterinarian</strong><span>Clinical work and patient care</span><small data-role-count="vet">0 users</small>
              </button>
              <button type="button" class="role-card" data-permission-role="staff">
                <strong>Staff</strong><span>Front desk and scheduling</span><small data-role-count="staff">0 users</small>
              </button>
              <button type="button" class="role-card role-card-locked" data-permission-role="superadmin">
                <strong>IT Administrator</strong><span>System maintenance only. Cannot see clinic data.</span><small data-role-count="superadmin">0 users</small>
              </button>
            </div>

            <div class="permissions-card">
              <div class="permissions-card-header">
                <div><h2 id="permissionsTitle">Permissions for Administrator</h2><p id="permissionsNotice" class="permissions-notice" hidden>🔒 Locked. This role can never open clinic data.</p></div>
                <button type="button" class="btn btn-primary" id="savePermissionsBtn">Save changes</button>
              </div>
              <div id="permissionsList"></div>
            </div>
          </section>

          <div class="head users-table-heading">
            <div class="head-left"><h5>All users</h5></div>
            <div class="users-admin-controls"></div>
          </div>

          <div class="table-responsive" id="usersTablePanel">
            <table class="table users-table">

              <thead>
                <tr>
                  <th>User</th>
                  <th>Role</th>
                  <th>Status</th>
                  <th>Last active</th>
                  <th class="text-end">&nbsp;</th>
                </tr>
              </thead>

              <tbody id="staffUsersTable">
                <tr>
                  <td colspan="5" class="text-center">
                    Loading user accounts...
                  </td>
                </tr>
              </tbody>

            </table>
          </div>
          <div class="small text-muted px-3 py-2 border-top" id="usersFooter">
            Showing 0 users
          </div>

        </div>

      </div>
    </main>
  </div>

  <div class="users-drawer-backdrop" id="usersDrawerBackdrop" hidden></div>
  <aside class="users-drawer" id="usersDrawer" aria-labelledby="drawerUserName" aria-hidden="true">
    <div class="users-drawer-header">
      <h2 id="drawerUserName">Manage user</h2>
      <button type="button" class="btn btn-outline-secondary btn-sm" id="closeUsersDrawer">Close</button>
    </div>
    <form id="userDrawerForm" class="users-drawer-form">
      <input type="hidden" id="drawerUserId">
      <label for="drawerName">Name</label>
      <input class="form-control" id="drawerName" type="text" required>
      <label for="drawerEmail">Email</label>
      <input class="form-control" id="drawerEmail" type="email" readonly>
      <label for="drawerRole">Role</label>
      <select class="form-select" id="drawerRole">
        <option value="staff">Staff</option>
        <option value="vet">Veterinarian</option>
        <option value="admin">Administrator</option>
        <option value="superadmin">IT Administrator</option>
        <option value="pending">Pending approval</option>
      </select>
      <label for="drawerStatus">Access</label>
      <select class="form-select" id="drawerStatus">
        <option value="Active">Active</option>
        <option value="Pending">Pending</option>
        <option value="Inactive">Inactive</option>
      </select>
      <p class="users-created-date" id="drawerCreated">Created —</p>
      <div class="users-drawer-actions">
        <button type="submit" class="btn btn-primary" id="saveDrawerUser">Save changes</button>
        <button type="button" class="btn btn-outline-secondary" id="resetUserPassword">Reset password</button>
      </div>
      <div class="users-drawer-delete-action">
        <button type="button" class="btn btn-outline-danger" id="deleteDrawerUser">Delete Account</button>
      </div>
    </form>
  </aside>

  <!-- EDIT PROFILE MODAL -->
  <div
    class="modal fade"
    id="editProfileModal"
    tabindex="-1"
    aria-labelledby="editProfileModalTitle"
    aria-hidden="true"
  >
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">

        <form id="editProfileForm">

          <div class="modal-header">
            <h5 class="modal-title" id="editProfileModalTitle">
              Edit account details
            </h5>

            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>

          <div class="modal-body">

            <div
              id="editProfileError"
              class="alert alert-danger d-none"
              role="alert"
            ></div>

            <div class="mb-3">
              <label for="editProfileName" class="form-label">
                Full name
              </label>

              <input
                type="text"
                class="form-control"
                id="editProfileName"
                maxlength="100"
                required
              >
            </div>

            <div>
              <label for="editProfileContact" class="form-label">
                Contact number
              </label>

              <input
                type="tel"
                class="form-control"
                id="editProfileContact"
                maxlength="30"
              >
            </div>

          </div>

          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-outline-secondary"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>

            <button
              type="submit"
              class="btn btn-primary"
              id="saveProfileBtn"
            >
              Save details
            </button>
          </div>

        </form>

      </div>
    </div>
  </div>

  <!-- BOOTSTRAP JAVASCRIPT -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- SHARED SIDEBAR JAVASCRIPT -->
  <script type="module" src="../js/header-actions.js?v=6"></script>
  <script
    type="module"
    src="../js/sidebar.js?v=13"
  ></script>

  <!-- ADMIN ACCESS GUARD -->
  <script type="module" src="../js/admin-guard.js?v=2"></script>

  <!-- USERS JAVASCRIPT -->
  <script type="module" src="../js/users.js?v=13"></script>

</body>
</html>
