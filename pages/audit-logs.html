<!DOCTYPE html>
<html lang="en">
<head>
  <script>(function () { var role = localStorage.getItem("userRole"); if (role) document.documentElement.setAttribute("data-role", role); }());</script>
  <script>
    const role = localStorage.getItem("userRole");
    if (role === "superadmin") document.documentElement.classList.add("role-superadmin");
    if (localStorage.getItem("userName") && localStorage.getItem("userRoleLabel")) document.documentElement.classList.add("header-ready");
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audit logs · SkinPawsible</title>
  <link rel="icon" type="image/jpeg" href="../images/LOGO.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="../css/style.css" rel="stylesheet">
  <link href="../css/app-shell.css?v=9" rel="stylesheet">
  <link href="../css/header-actions.css?v=2" rel="stylesheet">
  <link href="../css/audit-logs.css?v=1" rel="stylesheet">
</head>
<body>
  <div class="app-layout">
    <div id="sidebar-container"></div>
    <script src="../js/sidebar-ui.js?v=6"></script>

    <main class="main-content">
      <div class="topbar">
        <div>
          <h1 class="page-title">Audit logs</h1>
          <p class="page-sub">Review administrative activity and account changes.</p>
        </div>
        <div class="topbar-actions">
          <button type="button" class="btn btn-outline-secondary" id="logoutBtn">Log out</button>
        </div>
      </div>

      <div class="table-card audit-card">
        <div class="audit-toolbar">
          <div>
            <h2>Activity history</h2>
            <p>Only IT Administrators can view this page.</p>
          </div>
          <button type="button" class="btn btn-outline-secondary" id="refreshAuditLogs">Refresh</button>
        </div>
        <div class="table-responsive">
          <table class="table audit-table">
            <thead>
              <tr><th>Time</th><th>Actor</th><th>Action</th><th>Resource</th><th>Details</th></tr>
            </thead>
            <tbody id="auditLogsTable">
              <tr><td colspan="5" class="text-center text-muted py-4">Loading audit logs...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="../js/header-actions.js?v=6"></script>
  <script type="module" src="../js/sidebar.js?v=13"></script>
  <script type="module" src="../js/audit-logs.js?v=2"></script>
</body>
</html>
