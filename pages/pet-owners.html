<!DOCTYPE html>
<html lang="en">

<head>
  <script>(function () { var role = localStorage.getItem("userRole"); if (role) document.documentElement.setAttribute("data-role", role); }());</script>
  <script>
    const role = localStorage.getItem("userRole");
    if (role) document.documentElement.setAttribute("data-role", role);
    if (role === "superadmin") {
      document.documentElement.classList.add("role-superadmin");
    } else if (role) {
      document.documentElement.classList.add("role-clinic");
    }
    if (localStorage.getItem("userName") && localStorage.getItem("userRoleLabel")) {
      document.documentElement.classList.add("header-ready");
    }
  </script>
  <style>
    html.role-superadmin .sidebar .nav-item:has(> .nav-link[href="pet-records.html"]),
    html.role-superadmin .sidebar .nav-item:has(> .nav-link[href="scan-records.html"]),
    html.role-superadmin .sidebar .nav-item:has(> .nav-link[href="consultations.html"]) { display: none !important; }
    html.role-superadmin #adminNavigation { display: block !important; }
    html:not(.header-ready) .ha-profile { visibility: hidden; }
  </style>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pet Owners · SkinPawsible</title>
  <link rel="icon" type="image/jpeg" href="../images/LOGO.jpg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- SkinPawsible CSS -->
  <link href="../css/style.css" rel="stylesheet">
  <link href="../css/app-shell.css?v=9" rel="stylesheet">
  <link href="../css/header-actions.css?v=2" rel="stylesheet">
  <link href="../css/pet-owners.css?v=4" rel="stylesheet">
</head>

<body>

  <!-- APP LAYOUT -->
  <div class="app-layout">

    <!-- SHARED SIDEBAR -->
    <div id="sidebar-container"></div>
    <script src="../js/sidebar-ui.js?v=6"></script>

    <!-- MAIN CONTENT -->
    <main class="main-content">

      <!-- TOPBAR -->
      <div class="topbar topbar-stacked">
        <div class="topbar-search-row">
          <div class="po-search">
            <i class="bi bi-search"></i>
            <input
              type="search"
              id="ownerSearch"
              placeholder="Search owner, pet, or email"
              aria-label="Search pet owners"
            >
          </div>
          <div class="topbar-actions"></div>
        </div>

        <div>
          <h1 class="page-title">Pet Owners</h1>
        </div>
      </div>

      <!-- PET OWNERS CARD -->
      <div class="table-card">

        <div class="head po-head">

          <div class="po-tools">

            <div class="po-chips">
              <button type="button" class="po-chip active" data-filter="all">
                <i class="bi bi-grid-fill"></i> All
              </button>
              <button type="button" class="po-chip" data-filter="active">
                <i class="bi bi-check-circle-fill"></i> Active
              </button>
              <button type="button" class="po-chip" data-filter="inactive">
                <i class="bi bi-slash-circle-fill"></i> Inactive
              </button>
            </div>

            <div class="po-date-filter">
              <button
                type="button"
                id="ownerDateFilterToggle"
                class="po-date-filter-toggle"
                aria-expanded="false"
                aria-controls="ownerDateFilterPanel"
              >
                <i class="bi bi-calendar3" aria-hidden="true"></i>
                Date
                <i class="bi bi-chevron-down po-date-filter-chevron" aria-hidden="true"></i>
              </button>
              <div class="po-date-filter-panel" id="ownerDateFilterPanel" hidden>
                <label class="po-date-field">
                  <span>From</span>
                  <input type="date" id="ownerDateFrom" aria-label="Filter owners registered from date">
                </label>
                <label class="po-date-field">
                  <span>To</span>
                  <input type="date" id="ownerDateTo" aria-label="Filter owners registered through date">
                </label>
                <button type="button" class="po-date-reset" id="ownerDateReset">
                  Clear dates
                </button>
              </div>
            </div>

            <div class="po-date-sort" role="group" aria-label="Sort pet owners by registration date">
              <button type="button" class="po-sort active" id="ownerSortNewest" aria-pressed="true">
                <i class="bi bi-sort-down" aria-hidden="true"></i> Newest
              </button>
              <button type="button" class="po-sort" id="ownerSortOldest" aria-pressed="false">
                <i class="bi bi-sort-up" aria-hidden="true"></i> Oldest
              </button>
            </div>

          </div>
          <div class="po-head-actions">
            <button
              type="button"
              id="downloadOwnerReportBtn"
              class="btn btn-sm btn-outline-success"
              aria-label="Download visible pet owners as an Excel report"
              title="Download the currently visible pet owners as an Excel workbook"
              disabled
            >
              <i class="bi bi-file-earmark-spreadsheet" aria-hidden="true"></i>
              Download Excel Report
            </button>
            <div class="po-admin-controls"></div>
          </div>

        </div>

        <!-- PET OWNERS TABLE -->
        <div class="table-responsive">

          <table class="table po-table">

          <thead>
  <tr>
    <th scope="col">Pet Owner</th>
    <th scope="col">Pets</th>
    <th scope="col">Contact</th>
    <th scope="col">Registered</th>
    <th scope="col">Status</th>
  </tr>
</thead>
            <tbody id="petOwnersTable">
              <tr>
                <td colspan="5" class="po-message">
                  Loading pet owners...
                </td>
              </tr>
            </tbody>

          </table>

        </div>

        <div class="record-list-controls">
          <button type="button" class="record-list-show-more" id="petOwnersShowMore" hidden>
            Show remaining pet owners
          </button>
        </div>
        <div class="po-footer" id="ownerFooter">Showing 0 of 0 owners</div>

      </div>

    </main>
  </div>

  <!-- Bootstrap JavaScript -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>

  <!-- SHARED HEADER (must be before sidebar.js) -->
  <script type="module" src="../js/header-actions.js?v=6"></script>

  <!-- SHARED SIDEBAR JAVASCRIPT -->
  <script type="module" src="../js/sidebar.js?v=13"></script>

  <!-- PET OWNERS JAVASCRIPT -->
  <script type="module" src="../js/pet-owners.js?v=7"></script>

</body>
</html>
